name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[research,llm,dev]"
      - name: Lint
        run: ruff check src tests research --select F,E9
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q --cov=volevidence --cov-report=term
