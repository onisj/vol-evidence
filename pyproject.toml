[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-evidence"
version = "0.1.0"
description = "Testing the numbers options tools rely on: vendor implied volatility, market stress gauges, and LLM news summaries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Segun John Oni" }]
dependencies = ["yfinance>=0.2.40", "pandas>=2.0", "numpy>=1.26"]

[project.optional-dependencies]
research = ["matplotlib>=3.8", "scipy>=1.11", "statsmodels>=0.14"]
llm = ["anthropic>=2.0", "openai>=1.30", "boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pandas-stubs"]

[project.scripts]
vol-evidence = "volevidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src"]
